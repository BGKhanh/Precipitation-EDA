version: '3.8'

services:
  rainfall-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ds108-rainfall-forecast-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

